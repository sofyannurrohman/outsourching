version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-outsource}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-outsource}
      POSTGRES_DB: ${DB_NAME:-outsource_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outsource -d outsource_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - outsource-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - outsource-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=outsource
      - DB_PASSWORD=outsource
      - DB_NAME=outsource_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-this}
      - UPLOAD_DIR=/app/uploads
    env_file:
      - ./backend/.env
    ports:
      - "8081:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - outsource-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8081/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - outsource-net

networks:
  outsource-net:
    driver: bridge

volumes:
  postgres_data:
